{{- /* The site's data files. hugo.Data replaced site.Data in Hugo 0.156; the branch keeps both versions free of deprecation warnings. */ -}}
{{- $data := dict -}}
{{- if ge hugo.Version "0.156.0" -}}
  {{- $data = hugo.Data -}}
{{- else -}}
  {{- $data = site.Data -}}
{{- end -}}
{{- return $data -}}
