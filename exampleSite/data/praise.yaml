- quote: A novel that rings long after you close it. Thorne writes about craft with the authority of someone who has done it.
  source: The Northern Review
  context: on The Bell Foundry
- quote: Funny, exact and unexpectedly moving. I wanted to move to her fen and never leave.
  source: Mira Hollis
  context: author of The Salt Orchard
- quote: Thorne is the quiet master of the small-town novel. Every sentence has been weighed.
  source: Lamplight Quarterly
  context: on A Map of Quiet Places
